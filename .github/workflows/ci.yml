name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.7"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Fuzz sanitizers
        run: |
          go test ./internal/labels -fuzz=FuzzEmail -fuzztime=10s
          go test ./internal/labels -fuzz=FuzzSanitize -fuzztime=10s
          go test ./internal/config -fuzz=FuzzParse -fuzztime=10s
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
